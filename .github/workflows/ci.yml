name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # One stable gate for branch protection to require, so the rule never names a
  # Node version. Adding or dropping a matrix leg changes nothing here; without
  # this, raising the floor silently orphans the required context and blocks
  # every pull request until someone edits repository settings by hand.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: verify
    # Must run even when a leg fails or is cancelled — a skipped job never
    # reports, which is the exact failure mode this job exists to prevent.
    if: always()
    steps:
      - name: Require every verify leg to have succeeded
        run: |
          result='${{ needs.verify.result }}'
          if [ "$result" != 'success' ]; then
            echo "verify matrix concluded '$result', not 'success'." >&2
            exit 1
          fi
