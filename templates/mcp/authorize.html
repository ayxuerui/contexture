<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect to __STORE_NAME__</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #5f6368; --bg: #f6f6f4; --card: #ffffff; --line: #d9d9d4; --accent: #2f5d50; --error: #a1260d; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececea; --muted: #a4a4a0; --bg: #1b1b1a; --card: #262624; --line: #3a3a37; --accent: #8cc5b2; --error: #ff8a70; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; font: 1.1rem ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); }
  button { margin-top: 16px; width: 100%; padding: 12px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: var(--card); cursor: pointer; }
  .error { color: var(--error); font-weight: 600; }
  .fine { font-size: 0.85rem; margin: 16px 0 0; }
</style>
</head>
<body>
<main>
<h1>Connect __CLIENT_NAME__ to __STORE_NAME__</h1>
<p>Enter the access code you were given for this store. You only need to do this once per app.</p>
__ERROR__
<form method="post" action="/authorize">
__HIDDEN_FIELDS__
<label for="access_code">Access code</label>
<input type="text" id="access_code" name="access_code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required autofocus>
<button type="submit">Connect</button>
</form>
<p class="fine">Only enter your code on this page, at __ISSUER__. Nobody running this store will ask you for it anywhere else.</p>
</main>
</body>
</html>
