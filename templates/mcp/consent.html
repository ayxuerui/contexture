<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect an app to __STORE_NAME__</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #5f6368; --bg: #f6f6f4; --card: #ffffff; --line: #d9d9d4; --accent: #2f5d50; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececea; --muted: #a4a4a0; --bg: #1b1b1a; --card: #262624; --line: #3a3a37; --accent: #8cc5b2; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  ul { margin: 0 0 16px; padding-left: 20px; }
  code { font: 0.95em ui-monospace, SFMono-Regular, Menlo, monospace; }
  .actions { display: flex; gap: 12px; margin-top: 20px; }
  button { flex: 1; padding: 12px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  button.allow { border: 0; background: var(--accent); color: var(--card); }
</style>
</head>
<body>
<main>
<h1>Connect __CLIENT_NAME__ to __STORE_NAME__?</h1>
<p>You are signed in as <strong>__EMAIL__</strong>. If you allow it, this app may, as you:</p>
<ul>
__SCOPE_ITEMS__
</ul>
<p class="muted">It will be sent back to <code>__REDIRECT_HOST__</code>. Only allow this if you just started connecting the store from that app yourself.</p>
<form method="post" action="/authorize">
__HIDDEN_FIELDS__
<div class="actions">
<button type="submit" name="decision" value="deny">Cancel</button>
<button type="submit" name="decision" value="allow" class="allow">Allow</button>
</div>
</form>
</main>
</body>
</html>
