<!doctype html>
<html lang="en" data-ctxr-theme="{{THEME}}" data-ctxr-nav="{{NAV_STATE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="ctxr-shell-header">

<nav class="ctxr-theme-switcher" aria-label="Display theme">

<a href="?ctxr-theme=dark">Dark</a>
<a href="?ctxr-theme=system">System</a>
